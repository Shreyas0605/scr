name: Build FlipClock Screensaver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild FlipClockScreensaver.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Screensaver
      uses: actions/upload-artifact@v4
      with:
        name: FlipClockScreensaver
        path: bin/x64/Release/*.scr
